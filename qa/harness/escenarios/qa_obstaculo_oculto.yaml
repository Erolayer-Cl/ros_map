# QA 5f: pared de 5 m de alto con una columna escondida detrás de su extremo.
# El camino natural rodea la punta de la pared y la columna aparece recién al
# doblar: prueba la distancia de frenado de un dron con inercia.
nombre: qa_obstaculo_oculto
descripcion: Pared n=10 de e=-8 a e=1.5; columna r=0.4 escondida en (12.5, 3.0).
objetos:
  - tipo: pared
    nombre: pared
    desde: [10.0, -8.0]
    hasta: [10.0, 1.5]
    alto: 5.0
    espesor: 0.3
  - tipo: cilindro
    nombre: columna_oculta
    centro: [12.5, 3.0]
    radio: 0.4
    alto: 5.0
mision:
  tipo: waypoints
  altura: 3.0
  waypoints:
    - [20.0, 0.0]
  area: [-3.0, -12.0, 22.0, 12.0]
