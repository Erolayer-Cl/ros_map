# mission_node: parámetros de vuelo, esquive y misión de mapeo.
#
# Coordenadas RELATIVAS AL PUNTO DE DESPEGUE (norte, este) en metros; alturas
# positivas hacia arriba. Listas de números siempre con punto decimal.
/**:
  ros__parameters:
    px4:
      local_position_topic: /fmu/out/vehicle_local_position_v1   # PX4 v1.17
      status_topic: /fmu/out/vehicle_status_v1

    # --- /mission/start: waypoints (norte, este, altura) ---
    waypoints: [15.0, 0.0, 3.0,
                15.0, 10.0, 3.0]
    takeoff_altitude: 3.0
    land_at_end: true

    # --- vuelo ---
    cruise_speed: 1.5          # m/s. Para mapear, despacio: el mapa sale mejor
    climb_speed: 1.0
    acceptance_radius: 0.8
    max_lead: 1.5              # m que la referencia puede adelantarse al dron
    control_rate: 20.0
    nav:
      lead_time: 1.0           # s: la zanahoria no se adelanta más que v·esto (al frenar, se recoge)
      pose_timeout: 0.5        # s sin posición válida de PX4: frenar
      pose_loss_land_after: 2.0  # s sin posición: aterrizar en el lugar (0 = nunca)
      max_tracking_error: 0.75 # m de la referencia (KR: 0.75): frenar tracking_brake_sec (0 = off)
      tracking_brake_sec: 1.0
      yaw_mode: travel         # travel (mirar hacia donde va: obligatorio con cámara) | goal | fixed
      max_yaw_rate: 0.8
      use_planner: true        # A* sobre el mapa: resuelve trampas en U y pasillos
      replan_period: 1.0
      path_lookahead: 2.5
      stuck_timeout: 25.0
      accel_ramp_sec: 1.5

    plan:
      resolution: 0.3
      inflation_radius: 0.65   # radio del dron + 0.2 m: el camino nunca pasa más cerca
      # Ancho mínimo de paso (puertas): ≈ 2·(inflation_radius + resolution/2) = 1.6 m
      # para el A* y 2·(avoid.robot_radius + avoid.safety_margin) = 1.6 m para el VFH.
      cost_radius: 2.0         # entre 0.9 y 2.0 m se paga extra: prefiere el centro de pasillos
      unknown_penalty: 0.5

    # --- evasión reactiva (VFH+) ---
    avoid:
      enabled: true
      robot_radius: 0.45       # m, dron con hélices
      safety_margin: 0.35      # m extra alrededor de cada obstáculo (VFH)
      # Frenado físico (docs/evasion-entornos-reales.md): con d libres al frente
      # la velocidad máxima es v = −a·t + √((a·t)² + 2·a·(d − stop_distance)),
      # con t = latency + edad de los sectores. Reemplaza a slow_distance.
      max_decel: 1.0           # m/s² supuestos para frenar (ArduPilot usa ≤ 1; MPC_ACC_HOR = 3)
      latency: 0.4             # s sensor→frenado sin la edad del dato (como CP_DELAY de PX4)
      lookahead: 4.0           # m mínimos; crece con v·t + v²/2a + stop_distance
      stop_distance: 1.3       # m desde el centro: con esto al frente no se avanza
      emergency_distance: 0.7  # m: más cerca, alejarse (menor que robot_radius + safety_margin)
      trigger_hold: 0.2        # s que un desvío tiene que persistir (filtra lecturas espurias)
      blocked_timeout: 10.0
      sensor_timeout: 0.5      # s desde la CAPTURA del dato (PX4 CP: 0.5 s); más viejo = sin datos
      hold_on_sensor_loss: true
      require_sensors: true    # no despegar si no llegan /obstacles/sectors
      on_failure: return       # return | hold | skip
      on_return_failure: land  # land | hold: si no se puede volver al despegue
      escape_speed: 0.75       # m/s al alejarse en una emergencia (ArduPilot AVOID_BACKUP_SPD)
      seen_timeout: 1.0        # s: un sector que ningún sensor miró en este tiempo es desconocido
      fov_check_deg: 20.0      # ± grados alrededor del avance que tienen que estar a la vista
      sensor_loss_land_after: 10.0   # s sin datos de obstáculos en vuelo: aterrizar (0 = nunca)

    # --- failsafes y límites (docs/evasion-entornos-reales.md) ---
    safety:
      geofence: []             # [n0, e0, n1, e1] relativos al despegue; [] = área de mapeo + margen
      geofence_margin: 3.0     # m alrededor de map_mission.area
      min_altitude: 0.5        # m sobre el despegue: la referencia nunca baja de esto (salvo LAND)
      max_altitude: 20.0

    # --- /mission/map: misión de mapeo ---
    map_mission:
      area: [-5.0, -15.0, 25.0, 15.0]   # norte_min, este_min, norte_max, este_max
      altitude: 2.5
      strategy: frontier       # frontier (explora lo desconocido) | lawnmower (zigzag)
      lane_spacing: 6.0        # m entre carriles (lawnmower)
      max_duration: 600.0      # s
      min_frontier_length: 0.9
      spin_at_start: true      # giro de 360° al despegar (necesario con cámara)
      spin_at_goals: false
      reset_map: true          # borrar el mapa al empezar
      save_on_finish: true     # llamar a /map/save al terminar
      return_home: true
      goal_timeout: 60.0

    scan:
      yaw_rate: 0.6

    auto_start: ''             # '' | waypoints | mapeo  (sólo para simulación)
